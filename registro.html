<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Eclipse Suites Hotel</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="main-content">
        <!-- Lado Izquierdo: Marca con Animaciones -->
        <section class="brand-section">
            <div class="logo-wrapper">
                <img src="img/logo.webp" alt="Eclipse Suites Hotel Logo" class="brand-logo">
            </div>
            <h1 class="brand-title">ECLIPSE SUITES</h1>
            <p class="brand-description">Elegancia, confort y una experiencia inolvidable en cada estancia.</p>
        </section>

        <!-- Lado Derecho: Formulario de Registro -->
        <section class="login-container">
            <div class="login-header">
                <h2>Registrarse</h2>
                <p>Forma parte del club de membresía Eclipse.</p>
            </div>
            
            <form id="registerForm" class="login-form">
                <div class="form-group">
                    <label for="fullname">Nombre Completo</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Ingresa tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="nombre@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Crea una contraseña segura" required>
                </div>

                <div id="errorMessage" class="error-message" style="display:none;"></div>

                <button type="submit" class="btn-primary">Registrarse</button>

                <div class="form-options" style="justify-content: center; margin-top: 18px;">
                    <span>¿Ya tienes una cuenta? <a href="iniciar-sesion.html">Inicia sesión</a></span>
                </div>
            </form>
        </section>
    </main>

    <script src="js/registro.js"></script>
</body>
</html>

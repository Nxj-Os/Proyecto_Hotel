<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Eclipse Suites Hotel</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="main-content">
        <!-- Lado Izquierdo: Marca con Animaciones y Efecto Glowing -->
        <section class="brand-section">
            <div class="logo-wrapper">
                <img src="img/logo.webp" alt="Eclipse Suites Hotel Logo" class="brand-logo">
            </div>
            <h1 class="brand-title">ECLIPSE SUITES</h1>
            <p class="brand-description">Elegancia, confort y una experiencia inolvidable en cada estancia.</p>
        </section>

        <!-- Lado Derecho: Formulario de Login -->
        <section class="login-container">
            <div class="login-header">
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus credenciales para acceder</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <div class="form-options">
                    <label><input type="checkbox" name="remember"> Recordarme</label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <div id="errorMessage" class="error-message" style="display:none;"></div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>

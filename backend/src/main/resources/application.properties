spring.application.name=demo

# Render inyecta el puerto en la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# Los valores por defecto son los de desarrollo local. En Render se sobrescriben
# con las variables DB_* que el Blueprint (render.yaml) toma de la base de datos.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hotel_db}${DB_SSL_PARAMS:}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

spring.web.resources.static-locations=classpath:/static/,file:../frontend/
spring.web.resources.cache.cachecontrol.no-store=true
